# cargo-deny configuration — license/security/dependency hygiene.
# See https://embarkstudios.github.io/cargo-deny/
#
# Mirrors tpt-math's policy. Every crate in this workspace is MIT OR
# Apache-2.0, and no Apache-2.0-ONLY crate is permitted anywhere in the
# resolved graph. The transitive ecosystem crates we rely on (`uom`, `petgraph`,
# `num-traits`, `libm`, `proptest`'s tree) are all dual-licensed or more
# permissive.

[advisories]
version = 2
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# `unknown-git` stays "deny" as the default posture: a git dependency has to be
# opted into by name, so a new one cannot arrive unnoticed.
unknown-registry = "deny"
unknown-git = "deny"
# The one approved exception. `tpt-opt-core` is consumed from git because the
# `tpt-opt-*` family is not published to crates.io; the licence is
# MIT OR Apache-2.0, so the allow-list above already admits it. Listed
# explicitly so the exception is visible and reviewable rather than a blanket
# loosening of the policy.
#
# The URL must be the repository root -- cargo-deny matches the git URL, and
# adding a `.git` suffix or a subdirectory here silently fails to match.
allow-git = ["https://github.com/tpt-solutions/tpt-systems-optimisation"]
