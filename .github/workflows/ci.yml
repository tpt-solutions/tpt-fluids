name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `cargo nextest` runs the integration/unit test binaries; doctests are
      # covered separately because nextest does not execute them.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  # Documentation is verified as strictly as the code. An unresolved
  # intra-doc link is not a compile error and not a test failure: rustdoc drops
  # the link and emits the reference as plain text, so a dead cross-reference
  # ships silently. This job is the only thing that catches it, and it caught
  # four on its first run -- two of them written while fixing other bugs, which
  # is exactly the case a test suite cannot see.
  #
  # `RUSTDOCFLAGS: -D warnings` turns every rustdoc warning into a failure, so
  # an unresolved link, a bare URL, a broken heading anchor, or an unclosed
  # `#[doc]` block all stop the build. `--workspace` is deliberate: a link
  # resolves in the crate that writes it, and `MocNetwork` or `Self::foo` only
  # means something in the module that actually owns them.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --all-features --no-deps

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      # Only `tpt-fluids-core` declares `no_std` support (via features, not
      # forks), so we build that crate alone for a bare-metal target.
      - run: cargo build -p tpt-fluids-core --no-default-features --features alloc --target thumbv6m-none-eabi

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Feature-powerset CI for the umbrella crate, so that every combination of its
  # constituent re-export features is actually compiled and tested.
  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack test --feature-powerset --all-targets -p tpt-fluids

  kani:
    # Kani needs its own pinned nightly + CBMC backend; the toolchain is
    # installed by kani-verifier/setup action rather than rustup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
      # `--features kani` is what compiles the harness module at all; without
      # it Kani finds zero harnesses and "succeeds" vacuously. The count check
      # turns that silent pass into a failure.
      - run: |
          cargo kani -p tpt-fluids-verify --features kani | tee kani.log
          grep -E "Complete - [1-9][0-9]* successfully verified harnesses, 0 failures" kani.log
