name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # `cargo nextest` runs the integration/unit test binaries; doctests are
      # covered separately because nextest does not execute them.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      # Only `tpt-fluids-core` declares `no_std` support (via features, not
      # forks), so we build that crate alone for a bare-metal target.
      - run: cargo build -p tpt-fluids-core --no-default-features --features alloc --target thumbv6m-none-eabi

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Feature-powerset CI for the umbrella crate, so that every combination of its
  # constituent re-export features is actually compiled and tested.
  feature-powerset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack test --feature-powerset --all-targets -p tpt-fluids

  kani:
    # Kani needs its own pinned nightly + CBMC backend; the toolchain is
    # installed by kani-verifier/setup action rather than rustup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
      - run: cargo kani -p tpt-fluids-verify
