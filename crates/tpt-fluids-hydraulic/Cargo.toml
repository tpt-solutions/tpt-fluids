[package]
name = "tpt-fluids-hydraulic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "1D hydraulic pipe network analysis: Darcy-Weisbach/Colebrook-White friction, Hardy Cross and GGA solvers, water-hammer transients."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-fluids-hydraulic"
keywords = ["hydraulics", "pipe-network", "water-hammer", "hardy-cross", "engineering"]
categories = ["science", "mathematics"]

[dependencies]
tpt-fluids-core = { workspace = true, features = ["std"] }
# `nlp` enables the augmented-Lagrangian constrained solver in
# `tpt_opt_core::nlp`, which is what the network-sizing optimiser drives. It
# implies `alloc`; it is NOT a dependency on `tpt-math-optimize-general`, which
# the in-crate BFGS implementation replaced, so the published crate is not
# pulled in.
tpt-opt-core = { workspace = true, features = ["nlp"] }
tpt-math-graph = { workspace = true, features = ["std"] }
tpt-math-linalg = { workspace = true, features = ["std"] }
tpt-math-autodiff = { workspace = true, features = ["tpt-math-autodiff-fwd"] }

[features]
default = ["std"]
std = []

[lints]
workspace = true
